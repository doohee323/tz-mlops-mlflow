apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-serving
  namespace: airflow
  labels:
    app: mlflow-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-serving
  template:
    metadata:
      labels:
        app: mlflow-serving
    spec:
      containers:
      - name: mlflow-serving
        image: doohee323/ml_serving:latest
        ports:
        - containerPort: 8080
        env:
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            secretKeyRef:
              name: mlflow-secret
              key: tracking-uri
        - name: MLFLOW_TRACKING_USERNAME
          valueFrom:
            secretKeyRef:
              name: mlflow-secret
              key: username
        - name: MLFLOW_TRACKING_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mlflow-secret
              key: password
        - name: MODEL_NAME
          value: "Best Randomforest Model"
        - name: MODEL_VERSION
          value: "latest"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-serving
  namespace: airflow
  labels:
    app: mlflow-serving
spec:
  selector:
    app: mlflow-serving
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP 